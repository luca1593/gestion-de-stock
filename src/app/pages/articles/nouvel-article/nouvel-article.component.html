<div class="col p-3 mb-3">
    <div class="loading-overlay" *ngIf="loading">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <span>Chargement...</span>
        </div>
    </div>
    <div class="col-md-12 mb-3 photo-upload-container">
        <button (click)="fileInput.click()" class="photo-upload-btn">
            <img [src]='articleDto.photo ? articleDto.photo : imgUrl' alt="articleDto.designation"
                class="rounded-circle" width="150px" height="150px">
            <div class="photo-overlay">
                <i class="fas fa-camera"></i>
            </div>
            <input hidden type="file" #fileInput (change)="onFileInput(fileInput.files)">
        </button>
    </div>
    <hr>
    <div class="col-md-12">
        <div class="col-md-12 mb-3">
            <h2><i class="fas fa-info-circle blue-color"></i>&nbsp;Informations de l'article</h2>
        </div>
        <div class="col-md-12">
            <div class="alert alert-danger" *ngIf="errorMsgs.length > 0">
                <div *ngFor="let msg of errorMsgs">
                    <span>{{msg}}</span>
                </div>
            </div>
            <small class="text-muted d-block mb-2">Les champs marqués de <span class="text-danger">*</span> sont obligatoires</small>
            <form class="row" #articleForm="ngForm">
                <div class="col-md-6 mb-2">
                    <input type="text" name="codearticle" class="form-control" [(ngModel)]="articleDto.codeArticle"
                        id="codearticle" placeholder="Code article *" required #codeField="ngModel">
                    <div class="text-danger small mt-1" *ngIf="codeField.invalid && (codeField.dirty || codeField.touched || submitted)">
                        Ce champ est obligatoire
                    </div>
                </div>
                <div class="col-md-6 mb-2">
                    <input type="text" name="designation" class="form-control" [(ngModel)]="articleDto.designation"
                        id="designation" placeholder="Désignation *" required #designationField="ngModel">
                    <div class="text-danger small mt-1" *ngIf="designationField.invalid && (designationField.dirty || designationField.touched || submitted)">
                        Ce champ est obligatoire
                    </div>
                </div>
                <div class="col-md-6 mb-2">
                    <input type="number" name="prixht" class="form-control" [(ngModel)]="articleDto.prixUnitaireht"
                        (input)="calculerPrixTTC()" id="prixht" placeholder="Prix unitaire HT *" required min="0" step="0.01"
                        #prixhtField="ngModel" (keydown)="$event.key === '-' ? $event.preventDefault() : true">
                    <div class="text-danger small mt-1" *ngIf="(prixhtField.invalid || (articleDto.prixUnitaireht != null && articleDto.prixUnitaireht < 0)) && (prixhtField.dirty || prixhtField.touched || submitted)">
                        Ce champ est obligatoire
                    </div>
                </div>
                <div class="col-md-6 mb-2">
                    <input type="number" name="tva" class="form-control" (input)="calculerPrixTTC()"
                        [(ngModel)]="articleDto.tauxTva" id="tva" placeholder="Taux TVA *" required min="0" max="100" step="0.1"
                        #tvaField="ngModel" (keydown)="$event.key === '-' ? $event.preventDefault() : true">
                    <div class="text-danger small mt-1" *ngIf="(tvaField.invalid || (articleDto.tauxTva != null && articleDto.tauxTva < 0)) && (tvaField.dirty || tvaField.touched || submitted)">
                        Ce champ est obligatoire
                    </div>
                </div>
                <div class="col-md-6 mb-2">
                    <input type="number" name="prixttc" class="form-control" [(ngModel)]="articleDto.prixTtc" id="prixttc"
                        placeholder="Prix unitaire TTC *" required min="0" step="0.01" #prixttcField="ngModel"
                        (keydown)="$event.key === '-' ? $event.preventDefault() : true">
                    <div class="text-danger small mt-1" *ngIf="(prixttcField.invalid || (articleDto.prixTtc != null && articleDto.prixTtc < 0)) && (prixttcField.dirty || prixttcField.touched || submitted)">
                        Ce champ est obligatoire
                    </div>
                </div>
                <div class="col-md-6 mb-2">
                    <input type="number" name="stock" class="form-control" [(ngModel)]="articleDto.stock" id="stock"
                        placeholder="Stock" min="0" (keydown)="$event.key === '-' ? $event.preventDefault() : true">
                </div>
                <div class="col-md-6 mb-2">
                    <select class="form-control" name="categorie" id="categorie" [(ngModel)]="categoryDto.id"
                        required #categorieField="ngModel">
                        <option [ngValue]="null">Sélectionnez une catégorie *</option>
                        <option *ngFor="let cat of listCategorie" [ngValue]="cat.id">
                            {{cat.code}} - {{cat.designation}}
                        </option>
                    </select>
                    <div class="text-danger small mt-1" *ngIf="categorieField.invalid && (categorieField.dirty || categorieField.touched || submitted)">
                        Ce champ est obligatoire
                    </div>
                </div>
            </form>
        </div>
        <div class="col-md-12 text-end">
            <button class="btn btn-danger mx-1" (click)="cancelClick()">
                <i class="fas fa-ban"></i>&nbsp;Annuler
            </button>
            <button class="btn btn-success mx-1" (click)="saveClick()"
                [disabled]="!articleDto.codeArticle || !articleDto.designation || articleDto.prixUnitaireht == null || articleDto.prixUnitaireht < 0 || articleDto.tauxTva == null || articleDto.tauxTva < 0 || articleDto.prixTtc == null || articleDto.prixTtc < 0 || !categoryDto.id">
                <i class="fas fa-save"></i>&nbsp;Sauvegarder
            </button>
        </div>
    </div>
</div>

<div class="dashbord-container">
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" [class.collapsed]="menuCollapsed" [class.open]="sidebarOpen">
            <button class="menu-toggle" (click)="toggleMenu()" [title]="menuCollapsed ? 'Déplier le menu' : 'Replier le menu'">
                <i class="fas fa-chevron-left" [class.rotated]="menuCollapsed"></i>
            </button>
            <app-menu [collapsed]="menuCollapsed" (itemClicked)="fermerSidebar()"></app-menu>
        </aside>
        <div class="sidebar-backdrop" *ngIf="sidebarOpen" (click)="fermerSidebar()"></div>

        <!--
            Boite de confirmation unique de l'application. Elle est montee ici,
            dans le shell qui enveloppe toutes les pages, pour que n'importe
            quel ecran puisse l'ouvrir sans embarquer sa propre modale.
        -->
        <app-confirmation-dialog></app-confirmation-dialog>

        <!-- Main Content -->
        <main class="main-content" [class.menu-collapsed]="menuCollapsed">
            <!-- Header -->
            <header class="app-header">
                <app-header></app-header>
            </header>

            <!-- Content Area -->
            <section class="content-area">
                <app-laoder></app-laoder>
                <router-outlet></router-outlet>
            </section>
            
            <!-- Footer -->
            <footer class="app-footer">
                <div class="footer-content">
                    <span class="copyright">
                        <i class="fas fa-copyright"></i> 2026 Gestion de Stock
                    </span>
                </div>
            </footer>
        </main>
    </div>
</div>

<div class="dashbord-container">
    <div class="app-layout">
        <!-- Bouton toggle menu flottant -->
        <button class="menu-toggle" (click)="toggleMenu()" [class.collapsed]="menuCollapsed" title="Basculer le menu">
            <i class="fas" [class.fa-bars]="!menuCollapsed" [class.fa-chevron-left]="menuCollapsed"></i>
        </button>
        
        <!-- Sidebar -->
        <aside class="sidebar" [class.collapsed]="menuCollapsed">
            <app-menu [collapsed]="menuCollapsed"></app-menu>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content" [class.menu-collapsed]="menuCollapsed">
            <!-- Header -->
            <header class="app-header">
                <app-header></app-header>
            </header>
            
            <!-- Content Area -->
            <section class="content-area">
                <app-laoder></app-laoder>
                <router-outlet></router-outlet>
            </section>
            
            <!-- Footer -->
            <footer class="app-footer">
                <div class="footer-content">
                    <span class="copyright">
                        <i class="fas fa-copyright"></i> 2026 Gestion de Stock
                    </span>
                    <span class="date-time">
                        <i class="fas fa-calendar-alt"></i>
                        {{dateDuJour | date:'dd MMMM yyyy'}}
                        <span class="time-badge">{{dateDuJour | date:'HH:mm:ss'}}</span>
                    </span>
                </div>
            </footer>
        </main>
    </div>
</div>

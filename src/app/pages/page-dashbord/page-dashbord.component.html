<div class="dashbord-container">
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <img src="assets/images/logo-menu.svg" alt="Logo" width="32" height="32" class="me-2">
                <span>Gestion Stock</span>
            </div>
            <app-menu></app-menu>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="app-header">
                <app-header></app-header>
            </header>
            
            <!-- Content Area -->
            <section class="content-area">
                <app-laoder></app-laoder>
                <router-outlet></router-outlet>
            </section>
            
            <!-- Footer -->
            <footer class="app-footer">
                <div class="footer-content">
                    <span class="copyright">
                        <i class="fas fa-copyright"></i> 2024 Gestion de Stock
                    </span>
                    <span class="date-time">
                        <i class="fas fa-calendar-alt"></i>
                        {{dateDuJour | date:'dd MMMM yyyy'}}
                        <span class="time-badge">{{dateDuJour | date:'HH:mm:ss'}}</span>
                    </span>
                </div>
            </footer>
        </main>
    </div>
</div>

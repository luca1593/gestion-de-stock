<div class="col p-3 mb-3">
    <div class="col-md-12">
        <div class="col-md-12 mb-3">
            <h2 *ngIf="!isEditMode"><i class="fas fa-info-circle blue-color"></i>&nbsp;Nouvelle catégorie</h2>
            <h2 *ngIf="isEditMode"><i class="fas fa-pen blue-color"></i>&nbsp;Modification de la catégorie {{categoryDto.designation}}</h2>
        </div>
        <div class="col-md-12">
            <div class="alert alert-danger" *ngIf="errorMsg && errorMsg.length > 0">
                <div *ngFor="let msg of errorMsg">
                    <span>{{msg}}</span>
                </div>
            </div>
            <form class="row">
                <div class="col-md-12 mb-2">
                    <input type="text" class="form-control" id="codecategorie"
                    name="codeCategory" [(ngModel)]="categoryDto.code" required #codeField="ngModel"
                     placeholder="Code catégorie *">
                    <div class="text-danger small mt-1" *ngIf="codeField.invalid && (codeField.dirty || codeField.touched || submitted)">
                        Ce champ est obligatoire
                    </div>
                </div>
                <div class="col-md-12 mb-2">
                    <input type="text" class="form-control" id="description"
                    name="description" [(ngModel)]="categoryDto.designation"
                     placeholder="Description">
                </div>
            </form>
            <p class="text-muted small mt-2">Les champs marqués de * sont obligatoires</p>
        </div>
        <div class="col-md-12 text-end">
            <button class="btn btn-danger mx-1" (click)="cancelClick()">
                <i class="fas fa-ban"></i>&nbsp;Annuler
            </button>
            <button class="btn btn-success mx-1" (click)="saveClick()" [disabled]="saving || !categoryDto.code">
                <i class="fas" [class.fa-save]="!saving" [class.fa-spinner]="saving" [class.fa-spin]="saving"></i>&nbsp;{{ saving ? 'Enregistrement...' : 'Sauvegarder' }}
            </button>
        </div>
    </div>
</div>

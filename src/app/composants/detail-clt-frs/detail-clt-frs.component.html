<div class="row mb-1 custom-border">
    <div class="col-md-1 border-right py-2">
        <img [attr.src]="clientFournisseur.photo ? clientFournisseur.photo : 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2250%22%20fill%3D%22%23e9ecef%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2238%22%20r%3D%2216%22%20fill%3D%22%23adb5bd%22%2F%3E%3Cpath%20d%3D%22M18%2082c0-16%2014-30%2032-30s32%2014%2032%2030%22%20fill%3D%22%23adb5bd%22%2F%3E%3C%2Fsvg%3E'"
            [alt]="clientFournisseur.nom" width="50px" height="50px" />
    </div>
    <!-- Detail client / fournisseur -->
    <div class="col-md-4 border-right">
        <div class="row small-text my-1">
            <div class="row">
                <div class="col-md-1"><i class="fas fa-info-circle blue-color"></i></div>
                <div class="col-md-11">{{clientFournisseur.nom}}</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-info-circle blue-color"></i></div>
                <div class="col-md-11">{{clientFournisseur.prenom}}</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-phone blue-color"></i></div>
                <div class="col-md-11">{{clientFournisseur.numTel}}</div>
            </div>
        </div>
    </div>
    <!-- Detail Adresse -->
    <div class="col-md-4 border-right">
        <div class="row small-text my-1">
            <div class="row">
                <div class="col-md-1"><i class="fas fa-home blue-color"></i></div>
                <div class="col-md-11">
                    {{clientFournisseur.adresse?.adresse1}}&nbsp;
                    {{clientFournisseur.adresse?.adresse2}}
                </div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-map-marker-alt blue-color"></i></div>
                <div class="col-md-11">
                    {{clientFournisseur.adresse?.codePostal}}&nbsp;
                    {{clientFournisseur.adresse?.ville}}
                </div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-globe-europe blue-color"></i></div>
                <div class="col-md-11">{{clientFournisseur.adresse?.pays}}</div>
            </div>
        </div>
    </div>
    <!-- Boutton action -->
    <div class="col-md-3 d-flex align-items-center justify-content-center">
        <app-ligne-action
            [itemId]="clientFournisseur.id"
            (modifier)="modifierCltFrs()"
            (supprimer)="openDeleteModal()"
            (details)="detailCltFrs()">
        </app-ligne-action>
    </div>
</div>

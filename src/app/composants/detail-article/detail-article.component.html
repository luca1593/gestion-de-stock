<div class="row mb-1 custom-border">
    <div class="col-md-1 border-right p-2">
        <img [attr.src]="articleDTO.photo ? articleDTO.photo : 'favicon.ico'"
            [alt]="articleDTO.designation" width="70px" height="70px" />
    </div>
    <!-- Detail article -->
    <div class="col-md-4 border-right">
        <div class="row small-text my-1">
            <div class="row">
                <div class="col-md-1"><i class="fas fa-info-circle blue-color"></i></div>
                <div class="col-md-11"><strong>Code article :</strong>&nbsp;{{articleDTO.codeArticle}}</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-info-circle blue-color"></i></div>
                <div class="col-md-11"><strong>Designation : </strong>{{articleDTO.designation}}</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-dollar-sign blue-color"></i></div>
                <div class="col-md-11"><strong>PU HT : </strong>{{articleDTO.prixUnitaireht}}&nbsp;Ariary</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-dollar-sign blue-color"></i></div>
                <div class="col-md-11"><strong>PU TTC : </strong> {{articleDTO.prixTtc}}&nbsp;Ariary</div>
            </div>
        </div>
    </div>
    <!-- Detail categorie -->
    <div class="col-md-4 border-right">
        <div class="row">
            <div class="col-md-2"><i class="fas fa-flag-checkered blue-color"></i></div>
            <div class="col-md-10">
                <div class="row small-text">
                    <div class="col-md-12">{{articleDTO.category?.code}}</div>
                    <div class="col-md-12">{{articleDTO.category?.designation}}</div>
                </div>
            </div>
        </div>
    </div>
    <!-- Boutton action -->
    <div class="col-md-3 d-flex align-items-center justify-content-center">
        <app-ligne-action
            [itemId]="articleDTO.id"
            (modifier)="modifierArticle()"
            (supprimer)="openDeleteModal()"
            (details)="detailArticle()">
        </app-ligne-action>
    </div>
    <!-- Modal suppression article-->
    <div class="modal fade" id="modalConfirmDelete{{articleDTO.id}}" data-bs-backdrop="static" data-bs-keyboard="false"
        tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Confirmation</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Êtes-vous sûr de supprimer cet article ?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-ban"></i>&nbsp;
                        Annuler
                    </button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="supprimerArticle()">
                        <i class="fas fa-trash-alt"></i>&nbsp;
                        Supprimer
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mb-1 custom-border">
    <div class="col-md-1 border-right p-2">
        <img [attr.src]="articleDTO.photo ? articleDTO.photo : 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2212%22%20fill%3D%22%23e9ecef%22%2F%3E%3Crect%20x%3D%2228%22%20y%3D%2230%22%20width%3D%2244%22%20height%3D%2232%22%20rx%3D%224%22%20fill%3D%22%23adb5bd%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%2270%22%20width%3D%2236%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23ced4da%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%2278%22%20width%3D%2224%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23ced4da%22%2F%3E%3C%2Fsvg%3E'"
            [alt]="articleDTO.designation" width="70px" height="70px" />
    </div>
    <!-- Detail article -->
    <div class="col-md-4 border-right">
        <div class="row small-text my-1">
            <div class="row">
                <div class="col-md-1"><i class="fas fa-info-circle blue-color"></i></div>
                <div class="col-md-11"><strong>Code article :</strong>&nbsp;{{articleDTO.codeArticle}}</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-info-circle blue-color"></i></div>
                <div class="col-md-11"><strong>Designation : </strong>{{articleDTO.designation}}</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-dollar-sign blue-color"></i></div>
                <div class="col-md-11"><strong>PU HT : </strong>{{articleDTO.prixUnitaireht}}&nbsp;Ariary</div>
            </div>
            <div class="row">
                <div class="col-md-1"><i class="fas fa-dollar-sign blue-color"></i></div>
                <div class="col-md-11"><strong>PU TTC : </strong> {{articleDTO.prixTtc}}&nbsp;Ariary</div>
            </div>
        </div>
    </div>
    <!-- Detail categorie -->
    <div class="col-md-4 border-right">
        <div class="row">
            <div class="col-md-2"><i class="fas fa-flag-checkered blue-color"></i></div>
            <div class="col-md-10">
                <div class="row small-text">
                    <div class="col-md-12">{{articleDTO.category?.code}}</div>
                    <div class="col-md-12">{{articleDTO.category?.designation}}</div>
                </div>
            </div>
        </div>
    </div>
    <!-- Boutton action -->
    <div class="col-md-3 d-flex align-items-center justify-content-center">
        <app-ligne-action
            [itemId]="articleDTO.id"
            (modifier)="modifierArticle()"
            (supprimer)="openDeleteModal()"
            (details)="detailArticle()">
        </app-ligne-action>
    </div>
</div>

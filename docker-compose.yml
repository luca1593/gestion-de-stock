version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - API_URL=http://localhost:8080/ # Nom du conteneur backend
    container_name: gs-frontend
    ports:
      - "8086:80"
    environment:
      - API_URL=http://localhost:8080/
      - BACKEND_HOST=localhost
      - BACKEND_PORT=8080
    restart: unless-stopped
    networks:
      - gs-network  # Utiliser le réseau EXISTANT du backend
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Pour accéder à l'hôte depuis le conteneur
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# Utiliser le réseau existant (ne pas en créer un nouveau)
networks:
  gs-network:
    external: true
    name: gestiondestock_app-network  # Nom exact du réseau de votre backend
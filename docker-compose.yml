version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - API_URL=http://12.24.5.100:8085  # Pendant le build
    container_name: gs-frontend
    ports:
      - "8086:80"
    environment:
      - API_URL=http://12.24.5.100:8085  # À l'exécution
      - BACKEND_HOST=12.24.5.100
      - BACKEND_PORT=8085
    restart: unless-stopped
    networks:
      - gs-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Pour accéder à l'hôte depuis le conteneur
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gs-network:
    driver: bridge
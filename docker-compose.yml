version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - API_URL=http://12.24.5.100:8085
    container_name: gs-frontend
    ports:
      - "8086:80"
    environment:
      - API_URL=http://12.24.5.100:8085
    restart: unless-stopped

networks:
  default:
    name: gs-network
    driver: bridge